name: Build APK

# Builds the APK on every push and uploads it as an artifact, so the app can
# be tested without a local Android toolchain.
#
# The Ubuntu 26.04 rootfs is rebuilt here as well - it is not committed
# because it is ~330 MB per architecture and is produced by the tooling in
# tools/. See the README for the local workflow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      abi:
        description: 'Architecture to build'
        required: true
        default: arm64
        type: choice
        options: [arm64, armhf, amd64]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install SDK packages
        # GitHub's runners already ship the Android SDK, so use the one that
        # is there instead of pulling in another action.
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::no sdkmanager found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.1.13356709" \
            "cmake;3.22.1"

      - name: Cache the Ubuntu rootfs
        id: rootfs-cache
        uses: actions/cache@v4
        with:
          path: /opt/ubuntubuild
          key: rootfs-${{ inputs.abi || 'arm64' }}-${{ hashFiles('tools/build_rootfs.sh') }}

      - name: Build the Ubuntu 26.04 rootfs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 xz-utils zstd ca-certificates
          # The build extracts Ubuntu's .deb packages for a foreign
          # architecture, which apt insists on doing as root.
          sudo bash tools/build_rootfs.sh "${{ inputs.abi || 'arm64' }}" lite
          sudo bash tools/stage_rootfs.sh lite
          # The cache and the app's assets must be readable by the runner.
          sudo chown -R "$(id -u):$(id -g)" /opt/ubuntubuild app/src

      - name: Fetch the proot runtime
        run: |
          sudo bash tools/fetch_proot.sh
          sudo chown -R "$(id -u):$(id -g)" app/src/main/assets/proot

      - name: Run the unit tests
        run: ./gradlew -Pubuntumobile.buildDir=app/build :app:testArm64DebugUnitTest --rerun-tasks

      - name: Build the APK
        run: ./gradlew -Pubuntumobile.buildDir=app/build :app:assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-mobile-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The container has to actually work, not just compile.
  #
  # This job runs the exact command line the app builds against a real
  # Ubuntu 26.04 rootfs with a real proot. It is the only check that can
  # catch the failures that only show up on a phone: options the Termux
  # build of proot rejects, and guest programs that depend on something
  # proot changes.
  #
  # It runs on the amd64 rootfs, because that is the architecture the
  # runner can execute.
  # ---------------------------------------------------------------------------
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 xz-utils zstd ca-certificates build-essential pkg-config libtalloc-dev

      - name: Cache the Ubuntu rootfs
        uses: actions/cache@v4
        with:
          path: /opt/ubuntubuild
          key: rootfs-integration-amd64-${{ hashFiles('tools/build_rootfs.sh') }}

      - name: Build the Ubuntu 26.04 rootfs
        run: |
          sudo bash tools/build_rootfs.sh amd64 lite
          sudo chown -R "$(id -u):$(id -g)" /opt/ubuntubuild

      - name: Run the container end to end
        run: sudo bash tools/integration_test.sh amd64

